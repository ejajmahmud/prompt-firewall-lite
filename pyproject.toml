[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "prompt-firewall-lite"
version = "0.1.0"
description = "Sub-millisecond rule-based and vector heuristic guardrail intercepting prompt injections and jailbreaks"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Ejaj Mahmud", email = "dev@ejajmahmud.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = []

[project.scripts]
prompt-firewall-lite = "prompt_firewall_lite.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["prompt_firewall_lite*"]
